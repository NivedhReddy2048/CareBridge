<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Login - CareBridge</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
        }
        .form-control {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus {
            background-color: #333;
            border-color: #0d6efd;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .text-muted-dark {
            color: #a0a0a0;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <i class="fa-solid fa-hospital-user text-primary mb-3" style="font-size: 3rem;"></i>
        <h3 class="fw-bold mb-1">CareBridge Enterprise Console</h3>
        <p class="text-muted-dark small text-uppercase fw-semibold tracking-wide">Authorized staff access only</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger py-2 small fw-bold text-center border-0 bg-danger text-white rounded">
                <i class="fa-solid fa-triangle-exclamation me-2"></i>{{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'enterprise:enterprise_login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next|default:'/enterprise/' }}">
        
        <div class="mb-3">
            <label class="form-label small text-muted-dark fw-bold text-uppercase">Username</label>
            <input type="text" name="username" class="form-control" required autocomplete="username">
        </div>
        
        <div class="mb-4">
            <label class="form-label small text-muted-dark fw-bold text-uppercase">Password</label>
            <input type="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn btn-primary w-100">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login
        </button>
    </form>
    
    <div class="text-center mt-4">
        <a href="/" class="text-decoration-none text-muted-dark small"><i class="fa-solid fa-arrow-left me-1"></i> Return to main site</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
