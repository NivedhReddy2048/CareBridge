name: CareBridge Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: carebridge_db
          POSTGRES_USER: carebridge_user
          POSTGRES_PASSWORD: carebridge_pass
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/base.txt
        pip install pytest pytest-django
        
    - name: Migration Safety Validation
      env:
        DATABASE_URL: postgres://carebridge_user:carebridge_pass@localhost:5432/carebridge_db
      run: |
        # Ensure no migrations are missing
        python manage.py makemigrations --check --dry-run
        
        # Verify migrations can apply properly
        python manage.py migrate
        
    - name: Run Smoke Tests
      env:
        DATABASE_URL: postgres://carebridge_user:carebridge_pass@localhost:5432/carebridge_db
        REDIS_URL: redis://localhost:6379/1
        GEMINI_API_KEY: mock-api-key
      run: |
        python tests/smoke/smoke_runner.py

    - name: Run Pytest Test Suite
      env:
        DATABASE_URL: postgres://carebridge_user:carebridge_pass@localhost:5432/carebridge_db
        REDIS_URL: redis://localhost:6379/1
        GEMINI_API_KEY: mock-api-key
      run: |
        python -m pytest tests/ ai_engine/ enterprise/ api/ records/

    - name: Django Deploy Check
      env:
        DATABASE_URL: postgres://carebridge_user:carebridge_pass@localhost:5432/carebridge_db
        DJANGO_SETTINGS_MODULE: config.settings.production
      run: |
        python manage.py check --deploy
