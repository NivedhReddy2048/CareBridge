services:
  # PostgreSQL Database
  - type: pgo
    name: carebridge-db
    plan: free
    
  # Redis
  - type: redis
    name: carebridge-redis
    plan: free

  # Web Service (Django/Daphne)
  - type: web
    name: carebridge-web
    env: docker
    plan: starter
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: carebridge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: carebridge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: carebridge-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: carebridge-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: carebridge-db
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: carebridge-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
    
  # Celery Worker
  - type: worker
    name: carebridge-worker
    env: docker
    plan: starter
    dockerCommand: celery -A config worker -l info
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: carebridge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: carebridge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: carebridge-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: carebridge-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: carebridge-db
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: carebridge-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: carebridge-web
          envVarKey: SECRET_KEY

  # Celery Beat
  - type: worker
    name: carebridge-beat
    env: docker
    plan: starter
    dockerCommand: celery -A config beat -l info
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: carebridge-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: carebridge-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: carebridge-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: carebridge-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: carebridge-db
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: carebridge-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: carebridge-web
          envVarKey: SECRET_KEY
